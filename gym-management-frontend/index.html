<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/AsianFitnessLogo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Asian Fitness Center — Gym Management</title>
    <script>
      // Apply the saved theme before first paint so dark mode doesn't flash
      // light on load. Key must match STORAGE_KEY in src/context/ThemeContext.jsx.
      try {
        if (localStorage.getItem('themeMode') === 'dark') document.documentElement.dataset.theme = 'dark'
      } catch {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
